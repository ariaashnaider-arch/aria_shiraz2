name: Update upstream versions

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve latest stable versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          xui="$(curl -fsSL https://api.github.com/repos/MHSanaei/3x-ui/releases/latest | jq -r '.tag_name')"
          cloudflared="$(curl -fsSL https://api.github.com/repos/cloudflare/cloudflared/releases/latest | jq -r '.tag_name')"
          test -n "$xui" && test "$xui" != "null"
          test -n "$cloudflared" && test "$cloudflared" != "null"
          printf '%s\n' "$xui" > XUI_VERSION
          printf '%s\n' "$cloudflared" > CLOUDFLARED_VERSION
          echo "xui=$xui" >> "$GITHUB_OUTPUT"
          echo "cloudflared=$cloudflared" >> "$GITHUB_OUTPUT"

      - name: Commit version bump when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- XUI_VERSION CLOUDFLARED_VERSION; then
            echo "Already on the latest stable versions."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add XUI_VERSION CLOUDFLARED_VERSION
          git commit -m "chore: update 3x-ui and cloudflared"
          git push
